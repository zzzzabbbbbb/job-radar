# Una línea de configuración por empresa.
#   ats:   greenhouse | lever
#   token: el slug del board (job-boards.greenhouse.io/<token>, jobs.lever.co/<token>)
#   tier:  1 = me encantaría, 2 = interesante, 3 = de relleno (hoy solo es informativo)
#
# ¿No sabes el token? Corre el workflow "probe" con el nombre de la empresa,
# o `python -m radar probe "Nombre"`: prueba variantes en cada ATS y te dice cuál responde.
#
# verified: true = el board apareció en una búsqueda con vacantes en México/LatAm
# (sep 2026). false = token probable que no pude comprobar; si está mal, el digest
# lo va a reportar como fuente fallida al día siguiente.

